    <script src="../js/data.js?v=20260401"></script>
    <script src="../js/state-data.js?v=20260401"></script>
    <script src="../js/county-data.js?v=20260401"></script>
    <script>
    (function() {
        /* ── Constants ── */

        const AREA_ORDER = [
            { area: 'Safety & Health', metrics: ['violent_crime_rate', 'property_crime_rate', 'pcp_per_100k', 'uninsured_rate', 'suicide_rate'] },
            { area: 'Housing & Cost of Living', metrics: ['renter_cost_burden_pct', 'home_price_to_income', 'unsheltered_homeless_rate', 'residential_price_cpkwh', 'food_insecurity_rate'] },
            { area: 'Economy & Workforce', metrics: ['unemployment_rate', 'labor_force_participation', 'labor_productivity', 'real_per_capita_income', 'estabs_entry_rate', 'net_employer_formation'] },
            { area: 'Education', metrics: ['naep_math_8', 'naep_reading_8', 'acgr', 'ba_or_higher_pct'] },
            { area: 'Infrastructure, Resilience & Trust', metrics: ['road_poor_pct', 'broadband_subscription_pct', 'renewables_share_gen', 'rainy_day_fund_pct', 'voter_participation_rate', 'net_domestic_migration_rate'] },
        ];

        /* ── Helpers (kept from original) ── */
        function parseYear(key) {
            const parts = key.split('-');
            return Number(parts[parts.length - 1]);
        }

        function getVal(obj, targetYear) {
            const entries = Object.entries(obj).filter(([, v]) => v !== null && v !== undefined && v !== 0);
            for (const yr of [targetYear, targetYear - 1, targetYear + 1, targetYear - 2, targetYear + 2]) {
                const found = entries.find(([k]) => parseYear(k) === yr);
                if (found) return { yearKey: found[0], year: parseYear(found[0]), value: found[1] };
            }
            return null;
        }

        function getLatest(obj) {
            const entries = Object.entries(obj).filter(([, v]) => v !== null && v !== undefined && v !== 0);
            if (!entries.length) return null;
            const last = entries[entries.length - 1];
            return { yearKey: last[0], year: parseYear(last[0]), value: last[1] };
        }

        function isDecimalPct(m) {
            if (m.unit !== '%') return false;
            const vals = [...Object.values(m.hawaii), ...Object.values(m.otherStateAvg)].filter(v => v !== null && v !== 0);
            return vals.length > 0 && vals.every(v => Math.abs(v) <= 1);
        }

        function fmtChange(absChange, unit, isDec) {
            const sign = absChange > 0 ? '+' : '';
            if (isDec) return sign + (absChange * 100).toFixed(1) + '%';
            if (unit === '%') return sign + absChange.toFixed(1) + '%';
            if (unit === '$') {
                const a = Math.abs(Math.round(absChange));
                return (absChange >= 0 ? '+$' : '-$') + (a >= 1000 ? (a / 1000).toFixed(1) + 'K' : a.toLocaleString());
            }
            if (unit === '\u00d7') return sign + absChange.toFixed(1) + '\u00d7';
            if (unit === '\u00a2/kWh') return sign + absChange.toFixed(1) + '\u00a2';
            if (unit === 'per 100K') { const r = Math.abs(absChange) >= 10 ? Math.round(absChange) : +absChange.toFixed(1); return sign + r.toLocaleString() + ' per 100K'; }
            if (unit === 'per 10K') return sign + absChange.toFixed(1) + ' per 10K';
            if (unit === 'Index (2017=100)') return sign + absChange.toFixed(1) + ' points';
            if (unit === 'score') return sign + (Math.abs(absChange) >= 10 ? Math.round(absChange) : +absChange.toFixed(1)).toLocaleString() + ' points';
            const r = Math.abs(absChange) >= 10 ? Math.round(absChange) : +absChange.toFixed(1);
            return sign + r.toLocaleString();
        }

        /* ── Format gap in native units (unsigned, with "better"/"worse") ── */
        function fmtGap(gapValue, unit, isDec, betterOrWorse) {
            // Gap values from getRankForYear are already in display units
            // (decimal %s already multiplied by 100), so no isDec conversion needed
            const v = Math.abs(gapValue);
            let formatted;
            if (unit === '%') formatted = v.toFixed(1) + '%';
            else if (unit === '$') {
                const a = Math.round(v);
                formatted = '$' + (a >= 1000 ? (a / 1000).toFixed(1) + 'K' : a.toLocaleString());
            }
            else if (unit === '\u00d7') formatted = v.toFixed(1) + '\u00d7';
            else if (unit === '\u00a2/kWh') formatted = v.toFixed(1) + '\u00a2';
            else if (unit === 'per 100K') { const r = v >= 10 ? Math.round(v) : +v.toFixed(1); formatted = r.toLocaleString() + ' per 100K'; }
            else if (unit === 'per 10K') formatted = v.toFixed(1) + ' per 10K';
            else if (unit === 'Index (2017=100)' || unit === 'score') formatted = (v >= 10 ? Math.round(v) : +v.toFixed(1)).toLocaleString() + ' points';
            else { const r = v >= 10 ? Math.round(v) : +v.toFixed(1); formatted = r.toLocaleString(); }
            return formatted + ' ' + betterOrWorse;
        }

        /* ── Build sorted all-state rankings for a given metric + year ── */
        function getAllRanksForYear(slug, targetYear) {
            const sd = typeof STATE_DATA !== 'undefined' && STATE_DATA[slug];
            if (!sd || !sd.data) return null;
            const m = DASHBOARD_DATA[slug];
            const isDec = isDecimalPct(m);

            const firstKey = Object.keys(sd.data)[0];
            const isPCP = sd.data[firstKey] && typeof sd.data[firstKey].name === 'string';

            let stateValues = [];
            let actualYear = null;

            if (isPCP) {
                for (const tryYear of [targetYear, targetYear - 1, targetYear + 1, targetYear - 2, targetYear + 2]) {
                    stateValues = [];
                    let count = 0;
                    Object.values(sd.data).forEach(entry => {
                        if (entry[String(tryYear)] != null) {
                            stateValues.push({ state: entry.name, value: entry[String(tryYear)] });
                            count++;
                        }
                    });
                    if (count >= 25) { actualYear = tryYear; break; }
                }
            } else {
                for (const tryYear of [targetYear, targetYear - 1, targetYear + 1, targetYear - 2, targetYear + 2]) {
                    const matchedKey = Object.keys(sd.data).find(k => parseYear(k) === tryYear);
                    const yearData = matchedKey ? sd.data[matchedKey] : null;
                    if (!yearData) continue;
                    const entries = Object.entries(yearData).filter(([, v]) => v != null);
                    if (entries.length >= 25) {
                        stateValues = entries.map(([state, value]) => ({
                            state,
                            value: isDec ? value * 100 : value
                        }));
                        actualYear = tryYear;
                        break;
                    }
                }
            }

            if (!actualYear || stateValues.length < 25) return null;

            if (m.goodDirection === 'up') stateValues.sort((a, b) => b.value - a.value);
            else stateValues.sort((a, b) => a.value - b.value);

            return { stateValues, year: actualYear };
        }

        /* ── Rank for a specific year (Hawai'i) ── */
        function getRankForYear(slug, targetYear) {
            const all = getAllRanksForYear(slug, targetYear);
            if (!all) return null;
            const { stateValues, year } = all;

            const hiIdx = stateValues.findIndex(s =>
                s.state === 'Hawaii' || s.state === 'Hawai\u02BBi'
            );
            if (hiIdx < 0) return null;

            const hawaiiValue = stateValues[hiIdx].value;
            const sorted = stateValues.map(s => s.value).sort((a, b) => a - b);
            const medianValue = sorted[Math.floor(sorted.length / 2)];

            return {
                rank: hiIdx + 1,
                total: stateValues.length,
                hawaiiValue,
                medianValue,
                year
            };
        }

        /* ── Compute 5-year change for a metric ── */
        function computeChange(slug) {
            const m = DASHBOARD_DATA[slug];
            if (!m) return null;
            const isDec = isDecimalPct(m);
            const latest = getLatest(m.hawaii);
            if (!latest) return null;
            const base = getVal(m.hawaii, latest.year - 5);
            if (!base) return null;

            const absChange = latest.value - base.value;
            const relChange = base.value !== 0 ? (absChange / Math.abs(base.value)) * 100 : 0;

            let status;
            if (Math.abs(relChange) < 5) status = 'little-change';
            else status = (m.goodDirection === 'up' ? absChange > 0 : absChange < 0) ? 'improving' : 'worsening';

            return {
                slug, metric: m.metric, unit: m.unit, isDec,
                goodDirection: m.goodDirection,
                latestYear: latest.year,
                baseYear: base.year,
                absChange, relChange, status,
                changeText: fmtChange(absChange, m.unit, isDec),
            };
        }

        /* ── Rank + median gap for a metric ── */
        function computeStanding(slug, baseYear, latestYear, isDec, unit, goodDirection) {
            const endRank = getRankForYear(slug, latestYear);
            const startRank = getRankForYear(slug, baseYear);

            if (!endRank) return null;

            // Determine better/worse relative to median
            function betterOrWorse(hawaiiVal, medianVal) {
                if (goodDirection === 'up') return hawaiiVal >= medianVal ? 'better' : 'worse';
                return hawaiiVal <= medianVal ? 'better' : 'worse';
            }

            function isBetterThanMedian(hawaiiVal, medianVal) {
                if (goodDirection === 'up') return hawaiiVal > medianVal;
                return hawaiiVal < medianVal;
            }

            const endBW = betterOrWorse(endRank.hawaiiValue, endRank.medianValue);
            const endGap = Math.abs(endRank.hawaiiValue - endRank.medianValue);
            const endGapText = fmtGap(endGap, unit, isDec, endBW);
            const betterNow = isBetterThanMedian(endRank.hawaiiValue, endRank.medianValue);

            let standingText;
            if (startRank) {
                const startBW = betterOrWorse(startRank.hawaiiValue, startRank.medianValue);
                const startGap = Math.abs(startRank.hawaiiValue - startRank.medianValue);
                const startGapText = fmtGap(startGap, unit, isDec, startBW);
                const betterThen = isBetterThanMedian(startRank.hawaiiValue, startRank.medianValue);

                standingText = `National standing: Rank now #${endRank.rank} (was #${startRank.rank}) \u00b7 Gap vs median now ${endGapText} (was ${startGapText})`;
                return { standingText, endRank: endRank.rank, endTotal: endRank.total, startRank: startRank.rank, betterNow, betterThen };
            }

            standingText = `National standing: Rank now #${endRank.rank} of ${endRank.total} \u00b7 Gap vs median now ${endGapText}`;
            return { standingText, endRank: endRank.rank, endTotal: endRank.total, startRank: null, betterNow, betterThen: null };
        }

        /* ── County directions ── */
        function computeCountyDirections(slug) {
            const cd = typeof COUNTY_DATA !== 'undefined' && COUNTY_DATA[slug];
            if (!cd) return null;
            const m = DASHBOARD_DATA[slug];
            const isDec = isDecimalPct(m);
            const countyOrder = ['Honolulu', 'Hawai\u02BBi', 'Maui', 'Kauai'];
            const results = [];

            for (const county of countyOrder) {
                const cData = cd.data[county];
                if (!cData) { results.push({ county, direction: null }); continue; }
                const cLatest = getLatest(cData);
                if (!cLatest) { results.push({ county, direction: null }); continue; }
                const cBase = getVal(cData, cLatest.year - 5);
                if (!cBase) { results.push({ county, direction: null }); continue; }

                const change = cLatest.value - cBase.value;
                const rel = cBase.value !== 0 ? (change / Math.abs(cBase.value)) * 100 : 0;

                let direction;
                if (Math.abs(rel) < 5) direction = 'flat';
                else if (m.goodDirection === 'up' ? change > 0 : change < 0) direction = 'improved';
                else direction = 'worsened';

                results.push({ county, direction });
            }

            const valid = results.filter(r => r.direction !== null);
            if (valid.length < 2) return null;

            // Check for compression
            const dirs = valid.map(r => r.direction);
            const allSame = dirs.every(d => d === dirs[0]);
            if (allSame && valid.length === 4) {
                if (dirs[0] === 'improved') return { compressed: true, text: 'Counties: all 4 improved' };
                if (dirs[0] === 'worsened') return { compressed: true, text: 'Counties: all 4 worsened' };
                if (dirs[0] === 'flat') return { compressed: true, text: 'Counties: all 4 little change' };
            }

            return { compressed: false, counties: results.filter(r => r.direction !== null) };
        }

        /* ── Render county line HTML ── */
        function renderCountyLine(countyData) {
            if (!countyData) return '';
            if (countyData.compressed) return `<div class="fyc-line4">${countyData.text}</div>`;

            const parts = countyData.counties.map(c => {
                let arrow, cls;
                if (c.direction === 'improved') { arrow = '\u2191'; cls = 'county-improved'; }
                else if (c.direction === 'worsened') { arrow = '\u2193'; cls = 'county-worsened'; }
                else { arrow = '\u2192'; cls = 'county-flat'; }
                return `${c.county} <span class="${cls}">${arrow}</span>`;
            });
            return `<div class="fyc-line4">Counties: ${parts.join(' \u00b7 ')}</div>`;
        }

        /* ── Status chip labels with national-ranking context ── */
        function statusLabel(status, standing) {
            // Rank move: positive = rank number fell (e.g. #10→#6 = +4, better)
            const move = (standing && standing.startRank != null && standing.endRank != null)
                ? standing.startRank - standing.endRank
                : null;
            const gaining  = move != null && move >=  3;
            const trailing = move != null && move <= -3;

            if (status === 'improving') {
                if (gaining)  return 'Improving, outpacing the rest';
                if (trailing) return 'Improving, but behind the rest';
                return 'Improving, in step with the rest';
            }
            if (status === 'worsening') {
                if (gaining)  return 'Worsening less than the rest';
                if (trailing) return 'Worsening faster than the rest';
                return 'Worsening, in step with the rest';
            }
            // little-change
            if (gaining)  return 'Little change, while others worsen';
            if (trailing) return 'Little change, while others improve';
            return 'Little change';
        }

        function pl(count, singular, plural) { return count === 1 ? singular : (plural || singular + 's'); }

        /* ── Area narrative (5-7 sentences: executive-summary style) ── */
        function generateAreaNarrative(metrics) {
            const n = metrics.length;
            const improving = metrics.filter(r => r.status === 'improving');
            const worsening = metrics.filter(r => r.status === 'worsening');
            const s = [];

            // ── Gather ranking data ──
            const rankMoves = [];
            for (const r of metrics) {
                if (r.standing && r.standing.startRank != null) {
                    const move = r.standing.startRank - r.standing.endRank; // positive = climbed
                    rankMoves.push({ metric: r.metric, move, endRank: r.standing.endRank, startRank: r.standing.startRank, status: r.status, betterNow: r.standing.betterNow });
                }
            }
            const bigClimbs = rankMoves.filter(m => m.move >= 5).sort((a, b) => b.move - a.move);
            const bigDrops = rankMoves.filter(m => m.move <= -5).sort((a, b) => a.move - b.move);
            const betterNow = metrics.filter(r => r.standing && r.standing.betterNow).length;
            const betterThen = metrics.filter(r => r.standing && r.standing.betterThen != null && r.standing.betterThen).length;
            const bottomQ = rankMoves.filter(m => m.endRank > (m.endRank <= 50 ? 37 : 37)); // rough bottom quartile
            const bottomQMetrics = metrics.filter(r => r.standing && r.standing.endRank > 37);
            const topQMetrics = metrics.filter(r => r.standing && r.standing.endRank <= 13);

            // ── Gather county data ──
            const withCounty = metrics.filter(r => r.county);
            let countyDivergeCount = 0;
            let countyAlignedCount = 0;
            const countyOutliers = []; // specific county-metric pairs moving opposite to state
            for (const r of withCounty) {
                if (r.county.compressed) {
                    countyAlignedCount++;
                } else if (r.county.counties) {
                    const dirs = r.county.counties.map(c => c.direction);
                    const hasOpposites = dirs.includes('improved') && dirs.includes('worsened');
                    if (hasOpposites) {
                        countyDivergeCount++;
                        // Find the outlier counties
                        const majority = dirs.filter(d => d === 'improved').length >= dirs.filter(d => d === 'worsened').length ? 'improved' : 'worsened';
                        for (const c of r.county.counties) {
                            if (c.direction !== majority && c.direction !== 'flat') {
                                countyOutliers.push({ county: c.county, direction: c.direction, metric: r.metric });
                            }
                        }
                    } else {
                        countyAlignedCount++;
                    }
                }
            }

            // ── Sentence 1: Lead with rank-based area qualifier + trend detail ──
            // Qualification is driven by current national rank, not just 5-yr trend direction.
            const metricsWithRank = metrics.filter(r => r.standing && r.standing.endRank != null);
            const aboveMedianCount = metricsWithRank.filter(r => r.standing.endRank <= 25).length;
            const belowMedianCount = metricsWithRank.filter(r => r.standing.endRank > 25).length;
            // "strong" = majority rank in top half nationally; "weak" = majority in bottom half
            const rankQual = metricsWithRank.length > 0
                ? (aboveMedianCount > belowMedianCount ? 'strong' : belowMedianCount > aboveMedianCount ? 'weak' : 'neutral')
                : null;

            if (rankQual === 'strong') {
                if (worsening.length === 0 && improving.length > 0) {
                    const best = improving.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`This is one of Hawai\u02BBi's stronger areas nationally, with ${improving.length} of ${n} ${pl(n, 'metric')} improving and none worsening, led by ${best.metric} (${best.changeText}).`);
                } else if (improving.length > 0 && worsening.length > 0) {
                    const best = improving.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`Hawai\u02BBi holds a relatively strong national position here, though the trend is mixed: ${improving.length} ${pl(improving.length, 'metric')} improved while ${worsening.length} worsened, with ${best.metric} showing the most improvement (${best.changeText}).`);
                } else {
                    s.push(`This is one of Hawai\u02BBi's stronger areas nationally, though metrics have changed little over the last 5 years.`);
                }
            } else if (rankQual === 'weak') {
                if (improving.length === 0 && worsening.length > 0) {
                    const worst = worsening.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`This area is under pressure nationally, with ${worsening.length} of ${n} ${pl(n, 'metric')} worsening and none improving, most notably ${worst.metric} (${worst.changeText}).`);
                } else if (improving.length > 0 && worsening.length > 0) {
                    const worst = worsening.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`This remains a relative weakness nationally, with a mixed trend: ${worsening.length} ${pl(worsening.length, 'metric')} worsened while ${improving.length} improved; ${worst.metric} worsened the most (${worst.changeText}).`);
                } else {
                    s.push(`This area is a relative weakness nationally and has shown little change over the last 5 years.`);
                }
            } else {
                // Neutral rank split or no rank data: fall back to trend-based language
                if (worsening.length === 0 && improving.length > 0) {
                    const best = improving.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`A positive trend: ${improving.length} of ${n} ${pl(n, 'metric')} improved and none worsened, led by ${best.metric} (${best.changeText}).`);
                } else if (improving.length === 0 && worsening.length > 0) {
                    const worst = worsening.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`A challenging trend: ${worsening.length} of ${n} ${pl(n, 'metric')} worsened and none improved, most notably ${worst.metric} (${worst.changeText}).`);
                } else if (improving.length > 0 && worsening.length > 0) {
                    const best = improving.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    const worst = worsening.reduce((a, b) => Math.abs(b.relChange) > Math.abs(a.relChange) ? b : a);
                    s.push(`A mixed picture: ${improving.length} ${pl(improving.length, 'metric')} improved while ${worsening.length} worsened. The strongest improvement was ${best.metric} (${best.changeText}), while ${worst.metric} worsened the most (${worst.changeText}).`);
                } else {
                    s.push(`This area has been largely static, with all ${n} metrics showing little meaningful change over the last 5 years.`);
                }
            }

            // ── Sentence 2-3: Ranking narrative (biggest moves, or overall pattern) ──
            if (bigClimbs.length > 0 && bigDrops.length > 0) {
                const topClimb = bigClimbs[0];
                const topDrop = bigDrops[0];
                s.push(`National rankings improved and worsened within the same area: ${topClimb.metric} improved ${topClimb.move} spots to #${topClimb.endRank}, while ${topDrop.metric} worsened ${-topDrop.move} spots to #${topDrop.endRank}.`);
            } else if (bigClimbs.length > 0) {
                const topClimb = bigClimbs[0];
                s.push(`The standout ranking gain was ${topClimb.metric}, which improved ${topClimb.move} spots nationally to #${topClimb.endRank}.`);
                if (bigClimbs.length > 1) {
                    const second = bigClimbs[1];
                    s.push(`${second.metric} also improved ${second.move} spots to #${second.endRank}.`);
                }
            } else if (bigDrops.length > 0) {
                const topDrop = bigDrops[0];
                s.push(`The most concerning ranking shift was ${topDrop.metric}, which worsened ${-topDrop.move} spots nationally to #${topDrop.endRank}.`);
                if (bigDrops.length > 1) {
                    const second = bigDrops[1];
                    s.push(`${second.metric} also worsened ${-second.move} spots to #${second.endRank}.`);
                }
            } else {
                // No big moves, describe the general position
                const rankUpCount = rankMoves.filter(m => m.move > 0).length;
                const rankDownCount = rankMoves.filter(m => m.move < 0).length;
                if (rankUpCount > rankDownCount) {
                    s.push(`National rankings improved modestly on most metrics, though no single move exceeded 5 spots.`);
                } else if (rankDownCount > rankUpCount) {
                    s.push(`National rankings worsened modestly on most metrics, though no single move exceeded 5 spots.`);
                } else {
                    s.push(`National rankings were largely stable, with no metric moving more than a few spots.`);
                }
            }

            // ── Sentence 4: Median standing with interpretation ──
            if (betterNow > betterThen) {
                s.push(`Hawai\u02BBi now outperforms the median state on ${betterNow} of ${n} metrics; five years ago, it outperformed the median on ${betterThen}.`);
            } else if (betterNow < betterThen) {
                s.push(`Hawai\u02BBi outperforms the median state on only ${betterNow} of ${n} metrics; five years ago, that figure was ${betterThen}.`);
            } else if (betterNow === 0) {
                s.push(`Hawai\u02BBi remains below the median state on every metric in this area.`);
            } else if (betterNow === n) {
                s.push(`Hawai\u02BBi outperforms the median state on all ${n} metrics, holding that position from 5 years ago.`);
            } else {
                s.push(`Hawai\u02BBi outperforms the median state on ${betterNow} of ${n} metrics, unchanged from 5 years ago.`);
            }

            // ── Sentence 5: Bottom/top quartile callout if notable ──
            if (bottomQMetrics.length >= 2) {
                const names = bottomQMetrics.map(r => r.metric);
                s.push(`${names.slice(0, -1).join(', ')} and ${names[names.length - 1]} all sit in the bottom quartile nationally, signaling persistent structural challenges.`);
            } else if (bottomQMetrics.length === 1) {
                s.push(`${bottomQMetrics[0].metric} remains in the bottom quartile nationally (#${bottomQMetrics[0].standing.endRank}).`);
            } else if (topQMetrics.length >= 2) {
                const names = topQMetrics.map(r => r.metric);
                s.push(`${names.slice(0, -1).join(', ')} and ${names[names.length - 1]} all rank in the top quartile, a position of relative strength.`);
            }

            // ── Sentence 6-7: County pattern with specifics ──
            if (withCounty.length === 0) {
                s.push(`County-level data is not available for metrics in this area.`);
            } else if (withCounty.length === 1) {
                const r = withCounty[0];
                if (r.county.compressed) {
                    s.push(`County data is limited to ${r.metric}, where all four counties moved in the same direction as the state.`);
                } else {
                    // Name the specific divergence
                    const outlier = r.county.counties.find(c => c.direction === 'worsened') || r.county.counties.find(c => c.direction === 'improved');
                    if (outlier) {
                        s.push(`County data is limited to ${r.metric}, where ${outlier.county} ${outlier.direction} while other counties did not.`);
                    } else {
                        s.push(`County data is limited to ${r.metric}, where island-level trends varied.`);
                    }
                }
            } else {
                if (countyDivergeCount === 0) {
                    s.push(`Across the ${withCounty.length} metrics with county data, all four counties generally tracked the statewide trend, suggesting these patterns are broadly shared across islands.`);
                } else {
                    // Build a specific, memorable county sentence
                    if (countyOutliers.length > 0) {
                        // Find the most frequently diverging county
                        const freq = {};
                        countyOutliers.forEach(o => { freq[o.county] = (freq[o.county] || 0) + 1; });
                        const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
                        const topCounty = sorted[0][0];
                        const topCount = sorted[0][1];
                        const topExamples = countyOutliers.filter(o => o.county === topCounty);

                        if (topCount >= 2) {
                            const metricNames = topExamples.map(o => o.metric);
                            s.push(`At the county level, ${topCounty} stands out: it moved against the statewide direction on ${metricNames.join(' and ')}, suggesting island-specific conditions that the state average masks.`);
                        } else {
                            // Multiple counties diverging on different metrics
                            const ex1 = countyOutliers[0];
                            if (countyOutliers.length > 1) {
                                const ex2 = countyOutliers.find(o => o.county !== ex1.county) || countyOutliers[1];
                                s.push(`County trends split: ${ex1.county} ${ex1.direction} on ${ex1.metric} while the state moved the other way, and ${ex2.county} ${ex2.direction} on ${ex2.metric} against the statewide pattern.`);
                            } else {
                                s.push(`Most county trends track the state, but ${ex1.county} ${ex1.direction} on ${ex1.metric} while the rest of the state moved the other way.`);
                            }
                        }
                    } else {
                        s.push(`County trends are uneven across the ${withCounty.length} metrics with island-level data, with no single island consistently diverging from the state.`);
                    }
                }
            }

            return s.join(' ');
        }

        function areaId(area) {
            return area.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
        }

        /* ── Area scorecard (one row per policy area) ── */
        function buildAreaScorecard(allResults) {
            const rowItems = [];
            for (const areaGroup of AREA_ORDER) {
                const metrics = allResults.filter(r => r.area === areaGroup.area);
                if (!metrics.length) continue;

                const withRank = metrics.filter(r => r.standing && r.standing.endRank != null);
                const aboveMedian = withRank.filter(r => r.standing.betterNow).length;
                const imp = metrics.filter(r => r.status === 'improving').length;
                const wor = metrics.filter(r => r.status === 'worsening').length;
                const lit = metrics.filter(r => r.status === 'little-change').length;

                const id = areaId(areaGroup.area);

                // Overall area signal - driven by national standing alone
                const abovePct = withRank.length ? aboveMedian / withRank.length : 0.5;
                let areaClass = 'sc-mixed';
                if (abovePct >= 0.6) areaClass = 'sc-strong';
                else if (abovePct <= 0.4) areaClass = 'sc-weak';

                // Stars: filled left-to-right (above = filled green, below = empty gray)
                const starsSorted = [...withRank].sort((a, b) =>
                    (b.standing.betterNow ? 1 : 0) - (a.standing.betterNow ? 1 : 0)
                );
                const stars = starsSorted.map(m =>
                    `<span class="sc-star ${m.standing.betterNow ? 'above' : 'below'}" title="${m.metric}">${m.standing.betterNow ? '\u2605' : '\u2606'}</span>`
                ).join('');
                const standingText = withRank.length
                    ? `${aboveMedian} of ${withRank.length} above avg.`
                    : '';

                // Trend arrows
                const trendParts = [];
                if (imp) trendParts.push(`<span class="sc-trend-up">&#8593; ${imp} improving</span>`);
                if (wor) trendParts.push(`<span class="sc-trend-down">&#8595; ${wor} worsening</span>`);
                if (!imp && !wor) trendParts.push(`<span class="sc-trend-flat">&#8594; ${lit} unchanged</span>`);

                const sortOrder = areaClass === 'sc-weak' ? 0 : areaClass === 'sc-mixed' ? 1 : 2;
                rowItems.push({ sortOrder, html: `<a href="#fyc-area-${id}" class="fyc-scorecard-row ${areaClass}">
                    <span class="fyc-scorecard-area">${areaGroup.area}</span>
                    <span class="sc-stars">${stars}</span>
                    <span class="fyc-scorecard-standing-text">${standingText}</span>
                    <span class="fyc-scorecard-trend">${trendParts.join(' ')}</span>
                </a>` });
            }
            rowItems.sort((a, b) => a.sortOrder - b.sortOrder);
            let rows = rowItems.map(i => i.html).join('');
            return `<div class="fyc-scorecard">
                <div class="fyc-scorecard-title">Policy area overview</div>
                <div class="fyc-scorecard-header">
                    <span class="fyc-scorecard-hdr fyc-scorecard-hdr-area">Area</span>
                    <span class="fyc-scorecard-hdr fyc-scorecard-hdr-stars"></span>
                    <span class="fyc-scorecard-hdr fyc-scorecard-hdr-standing">National rank</span>
                    <span class="fyc-scorecard-hdr fyc-scorecard-hdr-trend">5-year trend</span>
                </div>
                ${rows}
            </div>`;
        }

        /* ── Build everything ── */
        function render() {
            // 1. Compute all metric results
            const allResults = [];
            for (const areaGroup of AREA_ORDER) {
                for (const slug of areaGroup.metrics) {
                    const change = computeChange(slug);
                    if (!change) continue;
                    const standing = computeStanding(slug, change.baseYear, change.latestYear, change.isDec, change.unit, change.goodDirection);
                    const county = computeCountyDirections(slug);

                    // Refine status: "improving" requires both trend AND rank to improve;
                    // "worsening" requires both trend AND rank to worsen.
                    // If they conflict (trend good but rank dropped, or vice versa), it's little change.
                    let status = change.status;
                    if (standing && standing.startRank != null) {
                        const rankImproved = standing.endRank < standing.startRank;
                        const rankWorsened = standing.endRank > standing.startRank;
                        if (status === 'improving' && !rankImproved) status = 'little-change';
                        if (status === 'worsening' && !rankWorsened) status = 'little-change';
                    }

                    allResults.push({
                        ...change,
                        status,
                        area: areaGroup.area,
                        standing,
                        county,
                    });
                }
            }

            // 2. Summary counts
            const improved = allResults.filter(r => r.status === 'improving').length;
            const worsened = allResults.filter(r => r.status === 'worsening').length;
            const littleChange = allResults.filter(r => r.status === 'little-change').length;
            const total = allResults.length;

            let betterNow = 0, betterThen = 0, rankUp = 0, rankDown = 0;
            for (const r of allResults) {
                if (r.standing) {
                    if (r.standing.betterNow) betterNow++;
                    if (r.standing.betterThen) betterThen++;
                    if (r.standing.startRank != null) {
                        if (r.standing.endRank < r.standing.startRank) rankUp++;
                        else if (r.standing.endRank > r.standing.startRank) rankDown++;
                    }
                }
            }

            // County pattern assessment
            const metricsWithCounty = allResults.filter(r => r.county);
            let countyPattern = 'mixed';
            if (metricsWithCounty.length > 0) {
                let alignedCount = 0;
                for (const r of metricsWithCounty) {
                    if (r.county.compressed) {
                        // All same direction; check if it matches state direction
                        if (r.county.text.includes('improved') && r.status === 'improving') alignedCount++;
                        else if (r.county.text.includes('worsened') && r.status === 'worsening') alignedCount++;
                        else if (r.county.text.includes('little change') && r.status === 'little-change') alignedCount++;
                    }
                }
                const ratio = alignedCount / metricsWithCounty.length;
                if (ratio >= 0.7) countyPattern = 'mostly aligned';
                else if (ratio <= 0.2) countyPattern = 'diverging';
            }

            // 3. Rank change counts
            const RANK_SHIFT = 2;
            const rankMoveTiers = { improved: [], stable: [], worsened: [] };
            for (const r of allResults) {
                if (!r.standing || r.standing.endRank == null) continue;
                const move = r.standing.startRank != null ? r.standing.startRank - r.standing.endRank : null;
                if (move != null && move >= RANK_SHIFT)       rankMoveTiers.improved.push({ r, move });
                else if (move != null && move <= -RANK_SHIFT) rankMoveTiers.worsened.push({ r, move });
                else                                          rankMoveTiers.stable.push({ r, move });
            }

            const chipsHtml = `<div class="fyc-chips-group">
                <div class="fyc-chips-row-label">5-Year Trends</div>
                <div class="fyc-chips">
                    <div class="fyc-chip worsening">
                        <div class="fyc-chip-count">${worsened}</div>
                        <div class="fyc-chip-label">Worsened</div>
                    </div>
                    <div class="fyc-chip little-change">
                        <div class="fyc-chip-count">${littleChange}</div>
                        <div class="fyc-chip-label">Little Change</div>
                    </div>
                    <div class="fyc-chip improving">
                        <div class="fyc-chip-count">${improved}</div>
                        <div class="fyc-chip-label">Improved</div>
                    </div>
                </div>
                <div class="fyc-chips-row-label">5-Year Ranking Changes</div>
                <div class="fyc-chips">
                    <div class="fyc-chip rank-down">
                        <div class="fyc-chip-count">${rankMoveTiers.worsened.length}</div>
                        <div class="fyc-chip-label">Worsened</div>
                    </div>
                    <div class="fyc-chip rank-same">
                        <div class="fyc-chip-count">${rankMoveTiers.stable.length}</div>
                        <div class="fyc-chip-label">Little Change</div>
                    </div>
                    <div class="fyc-chip rank-up">
                        <div class="fyc-chip-count">${rankMoveTiers.improved.length}</div>
                        <div class="fyc-chip-label">Improved</div>
                    </div>
                </div>
            </div>`;

            // 3c. Area scorecard
            const scorecardHtml = buildAreaScorecard(allResults);

            // 3e. National ranking table
            const allRanked = allResults
                .filter(r => r.standing && r.standing.endRank != null)
                .sort((a, b) => a.standing.endRank - b.standing.endRank);

            function rankColorClass(rank, tot) {
                const pct = rank / tot;
                if (pct <= 0.33) return 'rank-good';
                if (pct <= 0.67) return 'rank-mid';
                return 'rank-bad';
            }

            function rankMoveHtml(r) {
                if (!r.standing || r.standing.startRank == null) {
                    return `<span class="fyc-rank-move move-stable">&mdash;</span>`;
                }
                const move = r.standing.startRank - r.standing.endRank;
                if (move >= RANK_SHIFT) {
                    return `<span class="fyc-rank-move move-up">\u2191${move}</span>`;
                } else if (move <= -RANK_SHIFT) {
                    return `<span class="fyc-rank-move move-down">\u2193${Math.abs(move)}</span>`;
                }
                if (move === 0) return `<span class="fyc-rank-move move-stable">FLAT</span>`;
                if (move > 0) return `<span class="fyc-rank-move move-up">\u2191${move}</span>`;
                return `<span class="fyc-rank-move move-down">\u2193${Math.abs(move)}</span>`;
            }

            const CAT_SHORT = {
                'Safety & Health': 'Safety & Health',
                'Housing & Cost of Living': 'Housing',
                'Economy & Workforce': 'Economy',
                'Education': 'Education',
                'Infrastructure, Resilience & Trust': 'Infrastructure'
            };

            const rankData = allRanked.map(r => ({
                r,
                tot: r.standing.endTotal || 50,
                move: r.standing.startRank != null ? r.standing.startRank - r.standing.endRank : null
            }));

            let rankSortBy = 'rank', rankSortDir = 1;

            function renderRankRows() {
                const sorted = [...rankData].sort((a, b) => {
                    if (rankSortBy === 'rank') return (a.r.standing.endRank - b.r.standing.endRank) * rankSortDir;
                    if (rankSortBy === 'category') {
                        const c = a.r.area.localeCompare(b.r.area) * rankSortDir;
                        return c !== 0 ? c : a.r.standing.endRank - b.r.standing.endRank;
                    }
                    if (rankSortBy === 'move') {
                        const am = a.move != null ? a.move : -999;
                        const bm = b.move != null ? b.move : -999;
                        return (bm - am) * rankSortDir;
                    }
                    return 0;
                });
                const el = document.getElementById('fyc-rank-list');
                if (!el) return;
                el.innerHTML = sorted.map(({ r, tot, move }) => {
                    const cls = rankColorClass(r.standing.endRank, tot);
                    return `<a href="../#${r.slug}" class="fyc-rank-item ${cls}">
                        <span class="fyc-rank-num">#${r.standing.endRank} <span class="fyc-rank-year">(${r.latestYear})</span></span>
                        <span class="fyc-rank-name">${r.metric}</span>
                        <span class="fyc-rank-cat">${CAT_SHORT[r.area] || r.area}</span>
                        ${rankMoveHtml(r)}
                    </a>`;
                }).join('');
                ['rank', 'category', 'move'].forEach(col => {
                    const hdr = document.getElementById('fyc-rhdr-' + col);
                    if (!hdr) return;
                    const isActive = rankSortBy === col;
                    hdr.classList.toggle('active', isActive);
                    const ind = hdr.querySelector('.fyc-rank-sort-ind');
                    if (ind) {
                        ind.textContent = isActive ? (rankSortDir === 1 ? ' ▲' : ' ▼') : ' ↕';
                        ind.style.opacity = isActive ? '1' : '0.55';
                    }
                });
            }

            window._fycRankSort = function(col) {
                if (rankSortBy === col) rankSortDir *= -1;
                else { rankSortBy = col; rankSortDir = 1; }
                renderRankRows();
            };

            const rankTableHtml = `
                <div class="fyc-rank-breakdown">
                    <div class="fyc-rank-breakdown-title">National ranking</div>
                    <div class="fyc-rank-header">
                        <span class="fyc-rank-hdr-rank fyc-rank-hdr-sortable active" id="fyc-rhdr-rank" onclick="window._fycRankSort('rank')">Rank<span class="fyc-rank-sort-ind"> ▲</span></span>
                        <span class="fyc-rank-hdr-name">Metric</span>
                        <span class="fyc-rank-hdr-cat fyc-rank-hdr-sortable" id="fyc-rhdr-category" onclick="window._fycRankSort('category')">Category<span class="fyc-rank-sort-ind" style="opacity:0.3"> ▲</span></span>
                        <span class="fyc-rank-hdr-move fyc-rank-hdr-sortable" id="fyc-rhdr-move" onclick="window._fycRankSort('move')">5-yr Change in rank<span class="fyc-rank-sort-ind" style="opacity:0.3"> ▲</span></span>
                    </div>
                    <div class="fyc-rank-list" id="fyc-rank-list"></div>
                </div>`;

            // 5. Area sections
            function first2Sentences(text) {
                const m = text.match(/[^.!?]+[.!?]+/g);
                if (!m || m.length <= 2) return text;
                return m.slice(0, 2).join('').trim();
            }

            let areasHtml = '';
            for (const areaGroup of AREA_ORDER) {
                const areaMetrics = allResults.filter(r => r.area === areaGroup.area);
                if (!areaMetrics.length) continue;

                // Area narrative (2-sentence summary)
                const takeaway = first2Sentences(generateAreaNarrative(areaMetrics));

                // Render rows
                let rowsHtml = '';
                for (const r of areaMetrics) {
                    const yearRange = `(${r.baseYear}\u2013${r.latestYear})`;
                    const standingLine = r.standing ? r.standing.standingText : '';
                    const countyLine = renderCountyLine(r.county);

                    rowsHtml += `
                        <a href="../#${r.slug}" class="fyc-row">
                            <div class="fyc-line1">
                                <span class="fyc-metric-name">${r.metric}</span>
                                <span class="fyc-status ${r.status}">${statusLabel(r.status, r.standing)}</span>
                            </div>
                            <div class="fyc-line2">Hawai\u02BBi trend: <span class="${r.status === 'improving' ? 'fyc-val-pos' : r.status === 'worsening' ? 'fyc-val-neg' : ''}">${r.changeText}</span> ${yearRange}</div>
                            ${standingLine ? `<div class="fyc-line3">${standingLine}</div>` : ''}
                            ${countyLine}
                        </a>`;
                }

                const id = areaId(areaGroup.area);
                const rowsId = `fyc-rows-${id}`;
                areasHtml += `
                    <div class="fyc-area" id="fyc-area-${id}">
                        <div class="fyc-area-head">${areaGroup.area}</div>
                        <div class="fyc-area-takeaway">${takeaway}</div>
                        <button class="fyc-area-toggle" onclick="(function(btn){var el=document.getElementById('${rowsId}');var exp=el.classList.toggle('expanded');btn.textContent=exp?'Hide metrics \u25b4':'Show ${areaMetrics.length} metrics \u25be';})(this)">Show ${areaMetrics.length} metrics &#9662;</button>
                        <div class="fyc-area-rows" id="${rowsId}">
                            ${rowsHtml}
                        </div>
                    </div>`;
            }

            // 6. Method note
            const methodHtml = `<p class="fyc-method">Years vary by metric because source data updates on different schedules.</p>`;

            // Assemble: chips → scorecard → areas → ranking table → method
            document.getElementById('fyc-content').innerHTML = chipsHtml + scorecardHtml + areasHtml + rankTableHtml + methodHtml;
            renderRankRows();
        }

        render();
    })();
    </script>
</body>
