version: 2
updates:
  # Root npm (eslint, xlsx)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Honolulu"
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]

  # Tests npm (Playwright, etc.)
  - package-ecosystem: npm
    directory: "/tests"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Honolulu"
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
        update-types: [minor, patch]
    labels: [dependencies, tests]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Honolulu"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
