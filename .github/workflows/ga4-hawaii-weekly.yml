name: Weekly Hawaiʻi traffic email

# Runs the GA4 Hawaiʻi-only usage report and emails it.
# Geo-scoped to Hawaiʻi, so mainland datacenter/bot traffic is excluded.
#
# Schedule: Mondays 17:00 UTC (07:00 HST), a start-of-week glance.
# Manual run: Actions tab → this workflow → "Run workflow".
#
# Secrets required:
#   GA4_SA_KEY        service-account JSON (whole file contents)
#   GA4_PROPERTY_ID   numeric GA4 property id
#   MAIL_USERNAME / MAIL_PASSWORD / MAIL_TO   (+ optional MAIL_SERVER, MAIL_PORT, MAIL_FROM)

on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga4-hawaii-weekly
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Write GA4 service-account key
        run: printf '%s' "$GA4_SA_KEY" > "$RUNNER_TEMP/ga4-sa.json"
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}

      - name: Generate Hawaiʻi report
        run: node scripts/ga4-hawaii-report.js
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga4-sa.json

      - name: Email the report
        run: node scripts/email-report.js
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
