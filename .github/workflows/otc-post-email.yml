name: New post email

# Emails subscribers the day after an Off the Charts post is published.
# Fires on any push to main that touches js/otc-posts.js (sync-otc-meta
# regenerates it with every post), takes only the slugs that are new since
# the previous commit and dated within the last 7 days, waits for the post
# to answer on the live site, then creates a Resend broadcast scheduled for
# 12:00 HST the next day. That leaves a full day to cancel it in Resend if
# something is wrong. Put [no-email] in the commit message to skip.
#
# Manual run: pick the slug yourself (the 7-day guard does not apply);
# tick "now" to send immediately instead of the next day.
# Where it goes is the EMAIL_SEND_MODE repository variable (dry-run | beta | live).
# The broadcast is named otc-<slug>; a re-run for the same slug sends nothing.
#
# Secrets: RESEND_API_KEY, RESEND_SEGMENT_ID, RESEND_BETA_SEGMENT_ID, MAIL_TO

on:
  push:
    branches: [main]
    paths:
      - 'js/otc-posts.js'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug to send, e.g. renewables-prices'
        required: true
        type: string
      now:
        description: 'Send immediately instead of 12:00 HST the next day'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: otc-post-email
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-email]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the previous commit's js/otc-posts.js is the baseline

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build and send the new-post email
        run: node scripts/send-otc-email.js ${{ github.event_name == 'workflow_dispatch' && format('--slug {0}', inputs.slug) || format('--since {0}', github.event.before) }} ${{ inputs.now && '--now' || '' }}
        env:
          EMAIL_SEND_MODE: ${{ vars.EMAIL_SEND_MODE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_BETA_SEGMENT_ID: ${{ secrets.RESEND_BETA_SEGMENT_ID }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # Rolling `email-failed` issue: opened or updated when this job fails,
      # closed again by the next successful run. Rolled up by the weekly
      # health check under "Automated alerts".
      - name: Open or update the email-failed issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create email-failed --description "A subscriber email workflow failed" --color d73a4a 2>/dev/null || true
          N=$(gh issue list --state open --label email-failed --json number --jq '.[0].number // empty')
          BODY="**${{ github.workflow }}** failed on $(date -u +%Y-%m-%dT%H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "Subscriber email failed: ${{ github.workflow }}" --label email-failed --body "$BODY"; fi
      - name: Close the email-failed issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh issue list --state open --label email-failed --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue close "$N" --comment "**${{ github.workflow }}** succeeded on $(date -u +%Y-%m-%dT%H:%MZ). Closing." || true
