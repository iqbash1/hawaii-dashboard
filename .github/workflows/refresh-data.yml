name: Monthly Data Refresh

on:
  schedule:
    # 7:17 AM UTC on the 23rd of each month (avoid :00/:30 load spikes).
    # The 23rd is chosen so BLS state LAUS (typically released on the 3rd
    # Friday, between the 17th and 22nd) is reliably out before we run.
    # This keeps annual fetches and latestMonthly updates on the same cycle.
    - cron: '17 7 23 * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install --production 2>/dev/null || true
          pip install Pillow --quiet

      # ----- One-time setup: ensure the data-refresh label exists -----
      # `gh pr create --label data-refresh` (below) hard-fails if the label is
      # missing. Idempotent: succeeds silently if the label already exists.
      - name: Ensure data-refresh label exists
        run: |
          gh label create data-refresh \
            --description "Automated monthly data refresh PRs" \
            --color "1f6feb" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- Snapshot current data for diffing later -----
      - name: Snapshot current data
        run: |
          cp js/state-data.js /tmp/state-data-before.js
          cp js/data.js /tmp/data-before.js
          cp js/data.js /tmp/data.js.original   # recompute-data.js reads this for header preservation
          cp js/county-data.js /tmp/county-data-before.js
          cp about/index.html /tmp/about-before.html

      # ----- Fetch fresh data from federal APIs -----
      - name: Fetch state-level data
        run: node scripts/build-state-data.js
        env:
          # Required for FHWA (road quality) API which serves a self-signed cert in CI environments
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Fetch county-level data
        run: node scripts/build-county-data.js
        env:
          # Same as above - FHWA and some Census endpoints require this in GitHub Actions
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      # ----- Recompute derived values -----
      - name: Recompute data.js from state-data.js
        run: node scripts/recompute-data.js

      # ----- Refresh latestMonthly callouts (4 metrics: UR, LFP, electricity
      #       price, renewables share). Must run AFTER recompute-data.js so
      #       the recomputed data.js is the file we patch, not a stale copy.
      #       recompute-data.js only overwrites hawaii + medianSeries fields,
      #       so it preserves whatever latestMonthly is already in data.js;
      #       this step then refreshes those four blocks to the latest BLS /
      #       EIA monthly value.
      - name: Refresh latestMonthly values (BLS + EIA)
        run: node scripts/update-monthly.js

      # ----- Update derived files -----
      - name: Update about/index.html year ranges
        run: node scripts/update-about-years.js

      - name: Regenerate OG images and redirect pages
        run: python3 scripts/generate-og-pages.py

      # ----- Validate (strict mode for CI) -----
      - name: Validate data integrity
        id: validate
        run: |
          set +e
          set -o pipefail   # capture validator's real exit code, not tee's
          node scripts/validate-data.js --strict 2>&1 | tee /tmp/validation-output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0  # don't fail the step; we handle it below

      # ----- Fresh-fetch comparison (inform-only for v1) -----
      # Re-fetches each ACS metric's latest year directly from Census and
      # compares to data.js. Catches the class of bug that introduced
      # renter_cost_burden_pct 2024 = 0.5059 in March 2026 (hand-pasted
      # value drifting from the canonical fetch result). Inform-only:
      # writes results to the PR body but does not block merge.
      - name: Fresh-fetch comparison (inform-only)
        id: validate_fresh
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          node scripts/validate-data.js --fresh-fetch 2>&1 | tee /tmp/validation-fresh.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      # ----- Check what changed -----
      - name: Detect changes
        id: changes
        run: |
          CHANGED="false"
          SUMMARY=""
          for f in js/state-data.js js/data.js js/county-data.js; do
            if ! diff -q "$f" "/tmp/$(basename $f | sed 's/\.js/-before.js/')" > /dev/null 2>&1; then
              CHANGED="true"
              LINES=$(diff "/tmp/$(basename $f | sed 's/\.js/-before.js/')" "$f" | grep -c '^[<>]' || echo "0")
              SUMMARY="$SUMMARY\n- \`$f\`: $LINES lines changed"
            fi
          done
          if ! diff -q about/index.html /tmp/about-before.html > /dev/null 2>&1; then
            CHANGED="true"
            LINES=$(diff /tmp/about-before.html about/index.html | grep -c '^[<>]' || echo "0")
            SUMMARY="$SUMMARY\n- \`about/index.html\`: $LINES lines changed"
          fi
          # Always flag as changed so OG images/redirect pages get committed if regenerated
          if git status --short | grep -qE '^[ ?][?AM].*\.(html|png)'; then
            CHANGED="true"
            SUMMARY="$SUMMARY\n- OG images and redirect pages regenerated"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ----- Distinguish ERRORS from WARNINGS in the validator output -----
      # Both produce exit code 2 in --strict mode, but they need different
      # handling: errors mean the data itself is suspect (open an issue,
      # halt), while warnings are mostly advisory (e.g. narrative staleness,
      # source-overdue notices) and should not block a PR.
      - name: Count errors vs warnings in validator output
        id: errors
        run: |
          # awk is used (not `grep -c || echo 0`) because grep -c on no
          # matches still prints "0" AND exits 1, so `|| echo 0` writes a
          # second line — corrupting $GITHUB_OUTPUT with "Invalid format '0'".
          if [ -f /tmp/validation-output.txt ]; then
            ERR=$(awk '/ERROR:/ {c++} END {print c+0}' /tmp/validation-output.txt)
            WARN=$(awk '/WARN:/ {c++} END {print c+0}' /tmp/validation-output.txt)
          else
            ERR=0; WARN=0
          fi
          echo "error_count=$ERR" >> "$GITHUB_OUTPUT"
          echo "warning_count=$WARN" >> "$GITHUB_OUTPUT"

      # ----- If validation surfaced ERRORS, open an issue (block the PR) -----
      - name: Open issue on validation errors
        if: steps.errors.outputs.error_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/validation-output.txt', 'utf8');
            const errorLines = output.split('\n').filter(l => l.includes('ERROR:'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data refresh failed validation - ${new Date().toISOString().slice(0, 10)}`,
              body: `## Validation Errors\n\nThe monthly data refresh fetched new data but it failed validation checks.\n\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n<details><summary>Full validation output</summary>\n\n\`\`\`\n${output.slice(0, 10000)}\n\`\`\`\n</details>\n\nPlease investigate before manually re-running the workflow.`,
              labels: ['data-quality']
            });

      # ----- If data changed and there are no ERRORS, open a PR -----
      # (Warnings are surfaced in the PR body so the reviewer can act on them.)
      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && steps.errors.outputs.error_count == '0'
        run: |
          BRANCH="data-refresh/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add js/state-data.js js/data.js js/county-data.js about/index.html
          git add t/ r/ c/ rh/ assets/og/ 2>/dev/null || true
          git commit -m "Data refresh: $(date +%B\ %Y)

          Automated monthly data refresh from federal APIs.
          Run validation: $([ '${{ steps.errors.outputs.warning_count }}' = '0' ] && echo 'PASS' || echo 'PASS with ${{ steps.errors.outputs.warning_count }} warnings')"
          git push origin "$BRANCH"

          # Build PR body
          VALIDATION_STATUS=$([ '${{ steps.errors.outputs.warning_count }}' = '0' ] && echo 'All checks passed' || echo 'Passed with ${{ steps.errors.outputs.warning_count }} warnings (review below)')
          BODY=$(cat <<'PREOF'
          ## Monthly Data Refresh

          **Validation**: $VALIDATION_STATUS

          ### Files changed
          ${{ steps.changes.outputs.summary }}

          ### Validation output
          <details><summary>Click to expand</summary>

          ```
          $(cat /tmp/validation-output.txt)
          ```
          </details>

          ### Review checklist
          - [ ] Spot-check a few metrics in the diff for plausibility
          - [ ] Verify no unexpected metrics lost data
          - [ ] Check for narrative staleness warnings in the validation output and update insight/crossInsight/rankHistoryNarrative fields as needed
          - [ ] Preview the site after merge to confirm charts and rankings render correctly

          ---
          *Automated by [refresh-data workflow](../../actions/workflows/refresh-data.yml)*
          PREOF
          )

          gh pr create \
            --title "Data refresh: $(date +%B\ %Y)" \
            --body "$BODY" \
            --label "data-refresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- No changes -----
      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No data changes detected. All data is current."
