name: Monthly Data Refresh

on:
  schedule:
    # 7:17 AM UTC on the 23rd of each month (avoid :00/:30 load spikes).
    # The 23rd is chosen so BLS state LAUS (typically released on the 3rd
    # Friday, between the 17th and 22nd) is reliably out before we run.
    # This keeps annual fetches and latestMonthly updates on the same cycle.
    - cron: '17 7 23 * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install --production 2>/dev/null || true
          pip install Pillow --quiet

      # ----- One-time setup: ensure the data-refresh label exists -----
      # `gh pr create --label data-refresh` (below) hard-fails if the label is
      # missing. Idempotent: succeeds silently if the label already exists.
      - name: Ensure data-refresh label exists
        run: |
          gh label create data-refresh \
            --description "Automated monthly data refresh PRs" \
            --color "1f6feb" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- Snapshot current data for diffing later -----
      - name: Snapshot current data
        run: |
          cp js/state-data.js /tmp/state-data-before.js
          cp js/data.js /tmp/data-before.js
          cp js/data.js /tmp/data.js.original   # recompute-data.js reads this for header preservation
          cp js/county-data.js /tmp/county-data-before.js
          cp about/index.html /tmp/about-before.html

      # ----- Fetch fresh data from federal APIs -----
      # Both build scripts: set +e + pipefail + tee so we can capture the real
      # exit code (without pipefail, $? returns tee's exit, always 0) AND the
      # full stderr/stdout for the issue body. The on-disk file is only
      # overwritten on exit 0; on exit 1 (EXPECTED_METRICS floor check failure)
      # the existing js/state-data.js or js/county-data.js stays intact.
      - name: Fetch state-level data
        id: fetch_state
        run: |
          set +e
          set -o pipefail
          node scripts/build-state-data.js 2>&1 | tee /tmp/build-state-output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          # Required for FHWA (road quality) API which serves a self-signed cert in CI environments
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          # api.census.gov requires an API key as of ~2026-06-07 (8 ACS metrics).
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Fetch county-level data
        id: fetch_county
        run: |
          set +e
          set -o pipefail
          node scripts/build-county-data.js 2>&1 | tee /tmp/build-county-output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          # Same as above - FHWA and some Census endpoints require this in GitHub Actions
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          # api.census.gov requires an API key as of ~2026-06-07 (county ACS).
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      # ----- If either build script failed (e.g., a federal API returned HTML
      #       like the 2026-05-23 Census outage), open a labeled issue with the
      #       captured output and halt the workflow. Stops the run before
      #       recompute/validate/PR-creation, so no truncated artifacts ship.
      - name: Open issue on build-script failure
        if: steps.fetch_state.outputs.exit_code != '0' || steps.fetch_county.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stateExit  = '${{ steps.fetch_state.outputs.exit_code }}';
            const countyExit = '${{ steps.fetch_county.outputs.exit_code }}';
            const stateOut  = fs.existsSync('/tmp/build-state-output.txt')
              ? fs.readFileSync('/tmp/build-state-output.txt',  'utf8').slice(-4000) : '(no output captured)';
            const countyOut = fs.existsSync('/tmp/build-county-output.txt')
              ? fs.readFileSync('/tmp/build-county-output.txt', 'utf8').slice(-4000) : '(no output captured)';
            const failing = [];
            if (stateExit  !== '0') failing.push(`build-state-data.js (exit ${stateExit})`);
            if (countyExit !== '0') failing.push(`build-county-data.js (exit ${countyExit})`);
            const body = [
              '## Build script failure',
              '',
              `Failed: ${failing.join(', ')}`,
              '',
              'Most common cause: a federal API returned a non-JSON response (HTML maintenance page, 5xx, gateway error). The build script\'s EXPECTED_METRICS floor check caught the resulting partial output and exited without writing, so `js/state-data.js` and `js/county-data.js` are unchanged from the last-good cron.',
              '',
              '### Recovery',
              '1. Check the source APIs are responding with JSON: Census ACS, BLS LAUS, BEA, EIA, FRED, FHWA.',
              '2. Re-run this workflow manually from the Actions tab.',
              '3. If the same failure recurs, identify which fetcher is dropping (the floor-check message lists every missing slug) and investigate that specific API.',
              '',
              '### state build output (last 4KB)',
              '```',
              stateOut,
              '```',
              '',
              '### county build output (last 4KB)',
              '```',
              countyOut,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Data refresh build failed - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['data-quality'],
            });
            core.setFailed(`Build scripts failed: ${failing.join(', ')}`);

      # ----- Recompute derived values -----
      - name: Recompute data.js from state-data.js
        run: node scripts/recompute-data.js

      # ----- Refresh latestMonthly callouts (4 metrics: UR, LFP, electricity
      #       price, renewables share). Must run AFTER recompute-data.js so
      #       the recomputed data.js is the file we patch, not a stale copy.
      #       recompute-data.js only overwrites hawaii + medianSeries fields,
      #       so it preserves whatever latestMonthly is already in data.js;
      #       this step then refreshes those four blocks to the latest BLS /
      #       EIA monthly value.
      - name: Refresh latestMonthly values (BLS + EIA)
        run: node scripts/update-monthly.js

      # ----- Refresh stale narrative year stamps in data.js -----
      # When data advances (e.g., 2023 → 2024), narrative fields like
      # whyItMatters / howToRead may still cite the old year. This script
      # finds simple forward-looking patterns ("in 2023", "(2023)", etc.)
      # and bumps them. Historical references are deliberately untouched.
      # Any changes show up in the auto-generated PR diff for review.
      - name: Refresh stale narrative year stamps
        run: node scripts/update-narrative-years.js --apply

      # ----- Re-sync Question of the Day answers to the refreshed data -----
      # When a metric advances (e.g. county ba_or_higher 2023 -> 2024), any
      # QOTD whose answer cites that value drifts and fails the sync-qotd gate
      # (gate 3 of `npm run validate`). This step regenerates the answer text
      # in js/questions.js + the q/{id}/ pages so the monthly PR ships in sync.
      # sync-qotd exits non-zero only if a V6 (5-year-change) question's
      # TRUE/FALSE truth flips, an editorial event surfaced in the PR body +
      # checklist below (never silent). Added 2026-06-25 after the June refresh
      # advanced county data but left q100 drifted.
      - name: Sync QOTD answers to refreshed data
        id: sync_qotd
        run: |
          set +e
          set -o pipefail
          node scripts/sync-qotd-answers.js 2>&1 | tee /tmp/qotd-sync.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # ----- Update derived files -----
      - name: Update about/index.html year ranges
        run: node scripts/update-about-years.js

      - name: Regenerate OG images and redirect pages
        run: python3 scripts/generate-og-pages.py

      # ----- Validate (strict mode for CI) -----
      - name: Validate data integrity
        id: validate
        run: |
          set +e
          set -o pipefail   # capture validator's real exit code, not tee's
          node scripts/validate-data.js --strict 2>&1 | tee /tmp/validation-output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0  # don't fail the step; we handle it below

      # ----- Fresh-fetch drift check (BLOCKING since 2026-05-17) -----
      # Re-fetches each auto-audited metric's latest HI year directly from
      # the canonical federal source and compares to state-data.js.
      # Catches the bug class that introduced renter_cost_burden_pct 2024
      # = 0.5059 in March 2026 (hand-pasted value drifting from the
      # canonical fetch result). Now BLOCKING: ERROR-grade drift adds to
      # the combined error count, opens an issue, and blocks PR creation.
      # Cert/DNS/transient API failures still emit WARN (not ERROR) so
      # they do not block the monthly run.
      - name: Fresh-fetch drift check
        id: validate_fresh
        run: |
          set +e
          set -o pipefail
          node scripts/validate-data.js --fresh-fetch 2>&1 | tee /tmp/validation-fresh.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0  # don't fail the step; the combined error-count step below decides

      # ----- Check what changed -----
      - name: Detect changes
        id: changes
        run: |
          CHANGED="false"
          SUMMARY=""
          for f in js/state-data.js js/data.js js/county-data.js; do
            if ! diff -q "$f" "/tmp/$(basename $f | sed 's/\.js/-before.js/')" > /dev/null 2>&1; then
              CHANGED="true"
              LINES=$(diff "/tmp/$(basename $f | sed 's/\.js/-before.js/')" "$f" | grep -c '^[<>]' || echo "0")
              SUMMARY="$SUMMARY\n- \`$f\`: $LINES lines changed"
            fi
          done
          if ! diff -q about/index.html /tmp/about-before.html > /dev/null 2>&1; then
            CHANGED="true"
            LINES=$(diff /tmp/about-before.html about/index.html | grep -c '^[<>]' || echo "0")
            SUMMARY="$SUMMARY\n- \`about/index.html\`: $LINES lines changed"
          fi
          # Always flag as changed so OG images/redirect pages get committed if regenerated
          if git status --short | grep -qE '^[ ?][?AM].*\.(html|png)'; then
            CHANGED="true"
            SUMMARY="$SUMMARY\n- OG images and redirect pages regenerated"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          # Also write to a file so the PR-body step can `cat` it without
          # re-parsing the backtick-wrapped filenames through the shell.
          echo -e "$SUMMARY" > /tmp/changes-summary.md

      # ----- Distinguish ERRORS from WARNINGS in the validator output -----
      # Both produce exit code 2 in --strict mode, but they need different
      # handling: errors mean the data itself is suspect (open an issue,
      # halt), while warnings are mostly advisory (e.g. narrative staleness,
      # source-overdue notices) and should not block a PR.
      #
      # Combines errors from BOTH the main validator pass (data structure)
      # AND the fresh-fetch drift check (federal-source delta). Either
      # source of ERROR-grade findings will block PR creation and open
      # a labeled issue.
      - name: Count errors vs warnings in validator output
        id: errors
        run: |
          # awk is used (not `grep -c || echo 0`) because grep -c on no
          # matches still prints "0" AND exits 1, so `|| echo 0` writes a
          # second line, corrupting $GITHUB_OUTPUT with "Invalid format '0'".
          ERR_MAIN=0; WARN_MAIN=0; ERR_FRESH=0; WARN_FRESH=0
          if [ -f /tmp/validation-output.txt ]; then
            ERR_MAIN=$(awk '/ERROR:/ {c++} END {print c+0}' /tmp/validation-output.txt)
            WARN_MAIN=$(awk '/WARN:/ {c++} END {print c+0}' /tmp/validation-output.txt)
          fi
          if [ -f /tmp/validation-fresh.txt ]; then
            ERR_FRESH=$(awk '/ERROR:/ {c++} END {print c+0}' /tmp/validation-fresh.txt)
            WARN_FRESH=$(awk '/WARN:/ {c++} END {print c+0}' /tmp/validation-fresh.txt)
          fi
          ERR=$((ERR_MAIN + ERR_FRESH))
          WARN=$((WARN_MAIN + WARN_FRESH))
          echo "error_count=$ERR" >> "$GITHUB_OUTPUT"
          echo "warning_count=$WARN" >> "$GITHUB_OUTPUT"
          echo "error_count_main=$ERR_MAIN" >> "$GITHUB_OUTPUT"
          echo "error_count_fresh=$ERR_FRESH" >> "$GITHUB_OUTPUT"
          echo "Main validator: $ERR_MAIN errors, $WARN_MAIN warnings"
          echo "Fresh-fetch:    $ERR_FRESH errors, $WARN_FRESH warnings"

      # ----- If validation surfaced ERRORS, open an issue (block the PR) -----
      # Combines errors from both the main validator pass and the
      # fresh-fetch drift check so the user has both buckets surfaced in
      # one issue.
      - name: Open issue on validation errors
        if: steps.errors.outputs.error_count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const main = fs.existsSync('/tmp/validation-output.txt')
              ? fs.readFileSync('/tmp/validation-output.txt', 'utf8') : '';
            const fresh = fs.existsSync('/tmp/validation-fresh.txt')
              ? fs.readFileSync('/tmp/validation-fresh.txt', 'utf8') : '';
            const mainErrors  = main.split('\n').filter(l => l.includes('ERROR:'));
            const freshErrors = fresh.split('\n').filter(l => l.includes('ERROR:'));
            const errMain  = '${{ steps.errors.outputs.error_count_main }}';
            const errFresh = '${{ steps.errors.outputs.error_count_fresh }}';

            const sections = [];
            if (mainErrors.length > 0) {
              sections.push(
                `### Main validator errors (${errMain})\n\n` +
                '```\n' + mainErrors.join('\n') + '\n```'
              );
            }
            if (freshErrors.length > 0) {
              sections.push(
                `### Fresh-fetch drift errors (${errFresh})\n\n` +
                '```\n' + freshErrors.join('\n') + '\n```\n\n' +
                '_Drift means state-data.js disagrees with the canonical federal source ' +
                'beyond tolerance (0.5% relative or 0.0001 absolute). Either a source ' +
                'published a revised vintage (accept + update state-data) or a fetcher ' +
                'parsing issue introduced bad values (investigate)._'
              );
            }

            const fullOutput = (main + '\n\n=== FRESH FETCH ===\n\n' + fresh).slice(0, 10000);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data refresh failed validation - ${new Date().toISOString().slice(0, 10)}`,
              body: `## Validation Errors\n\nThe monthly data refresh fetched new data but it failed validation checks.\n\n${sections.join('\n\n')}\n\n<details><summary>Full validator output</summary>\n\n\`\`\`\n${fullOutput}\n\`\`\`\n</details>\n\nPlease investigate before manually re-running the workflow.`,
              labels: ['data-quality']
            });

      # ----- If data changed and there are no ERRORS, open a PR -----
      # (Warnings are surfaced in the PR body so the reviewer can act on them.)
      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && steps.errors.outputs.error_count == '0'
        run: |
          BRANCH="data-refresh/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add js/state-data.js js/data.js js/county-data.js js/questions.js about/index.html
          git add t/ r/ c/ rh/ q/ assets/og/ 2>/dev/null || true
          git commit -m "Data refresh: $(date +%B\ %Y)

          Automated monthly data refresh from federal APIs.
          Run validation: $([ '${{ steps.errors.outputs.warning_count }}' = '0' ] && echo 'PASS' || echo 'PASS with ${{ steps.errors.outputs.warning_count }} warnings')"
          git push origin "$BRANCH"

          # Build PR body into a file. The previous `cat <<'PREOF'` quoted
          # heredoc left $VALIDATION_STATUS and $(cat ...) as literal text in
          # the PR. Assembling with echo/cat expands the shell vars and inlines
          # the validation output + change summary from files (so the
          # backtick-wrapped filenames in the summary are never re-parsed).
          VALIDATION_STATUS=$([ '${{ steps.errors.outputs.warning_count }}' = '0' ] && echo 'All checks passed' || echo "Passed with ${{ steps.errors.outputs.warning_count }} warnings (review below)")
          QOTD_STATUS=$([ '${{ steps.sync_qotd.outputs.exit_code }}' = '0' ] && echo 'In sync' || echo '⚠️ V6 truth flip or sync error — review the q/ changes before merge (see workflow log: Sync QOTD answers)')
          {
            echo "## Monthly Data Refresh"
            echo ""
            echo "**Validation**: $VALIDATION_STATUS"
            echo ""
            echo "**QOTD sync**: $QOTD_STATUS"
            echo ""
            echo "### Files changed"
            cat /tmp/changes-summary.md
            echo ""
            echo "### Validation output"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '```'
            cat /tmp/validation-output.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "### Review checklist"
            echo "- [ ] Spot-check a few metrics in the diff for plausibility"
            echo "- [ ] Verify no unexpected metrics lost data"
            echo "- [ ] Check for narrative staleness warnings and update insight/crossInsight/rankHistoryNarrative fields as needed"
            echo "- [ ] Review any QOTD answer changes in q/ (especially flagged V6 truth flips)"
            echo "- [ ] Preview the site after merge to confirm charts and rankings render correctly"
            echo ""
            echo "---"
            echo "*Automated by [refresh-data workflow](../../actions/workflows/refresh-data.yml)*"
          } > /tmp/pr-body.md

          gh pr create \
            --title "Data refresh: $(date +%B\ %Y)" \
            --body-file /tmp/pr-body.md \
            --label "data-refresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- No changes -----
      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No data changes detected. All data is current."
