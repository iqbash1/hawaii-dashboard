# Notify state-dashboards (sibling repo) of changes on main.
#
# Fires a repository_dispatch event with type `hd-changed` whenever a push
# to main touches files state-dashboards inherits or watches:
#   - js/state-data.js    (canonical data; Phase 1 auto-PRs)
#   - data/**.csv         (Phase 1 mirror, intersection mode)
#   - js/**.js            (Phase 2 chrome-drift detector)
#   - css/**.css          (Phase 2)
#   - scripts/build-state-data.js  (shared fetcher)
#
# The state-dashboards workflows `sync-from-hd.yml` and
# `check-chrome-drift.yml` are subscribed to this event type. The daily
# cron in those workflows is the safety net; this turns the loop into
# near-real-time.
#
# Required HD repo secret:
#   SD_DISPATCH_TOKEN, fine-grained PAT scoped to iqbash1/state-dashboards
#                        with Contents: write (required by the
#                        repository_dispatch API).

name: Notify state-dashboards

on:
  push:
    branches: [main]
    paths:
      - 'js/state-data.js'
      - 'js/**.js'
      - 'css/**.css'
      - 'data/**.csv'
      - 'scripts/build-state-data.js'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at state-dashboards
        env:
          TOKEN: ${{ secrets.SD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::SD_DISPATCH_TOKEN not set; skipping dispatch."
            exit 0
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iqbash1/state-dashboards/dispatches \
            -d "{\"event_type\":\"hd-changed\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\",\"commit_url\":\"https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\"}}")
          echo "HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "Dispatch failed:"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Dispatched hd-changed event for ${GITHUB_SHA}"
