name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so only the latest commit is tested
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build dist and verify asset sizes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Run build script
        run: bash build.sh

      - name: Verify no file in dist/ exceeds 25 MB (Cloudflare limit)
        run: |
          set -e
          LIMIT_MB=25
          LIMIT_BYTES=$((LIMIT_MB * 1024 * 1024))
          found=0
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            if [ "$size" -gt "$LIMIT_BYTES" ]; then
              echo "FAIL: $file is $(( size / 1024 / 1024 ))MB (limit ${LIMIT_MB}MB)"
              found=1
            fi
          done < <(find dist -type f -print0)
          if [ "$found" -eq 1 ]; then
            echo "One or more files exceed the Cloudflare 25 MB asset limit."
            echo "Run bash build.sh locally and check dist/ for oversized files."
            exit 1
          fi
          total=$(find dist -type f | wc -l | tr -d ' ')
          echo "PASS: $total files in dist/, all under ${LIMIT_MB} MB"

      - name: Verify .git is not included in dist/
        run: |
          if [ -d dist/.git ]; then
            echo "FAIL: dist/ contains .git directory - build.sh must exclude it"
            exit 1
          fi
          echo "PASS: dist/ does not contain .git"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install lint dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: [build-check, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # Polls for deployment then runs full live site verification.
  # Only runs on pushes to main (not PRs).
  prod-canary:
    name: Live site verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Verify live site (poll for deploy + full integrity checks)
        run: bash scripts/verify-live-site.sh
