name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so only the latest commit is tested
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # Runs ~5 minutes after deploy to catch CDN/CF deployment failures
  # Only runs on pushes to main (not PRs, since the live site is not affected by PRs)
  prod-canary:
    name: Production canary (live site)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    timeout-minutes: 10

    steps:
      - name: Wait for Cloudflare deployment to propagate
        run: sleep 300

      - name: Check live site renders 27 metric cards
        run: |
          set -e
          echo "Checking https://hawaiidashboard.org/ ..."

          # Fetch the homepage
          body=$(curl -fsSL --max-time 15 "https://hawaiidashboard.org/")

          # Must include at least 27 data-metric attributes
          count=$(echo "$body" | grep -o 'data-metric="' | wc -l | tr -d ' ')
          echo "data-metric count: $count"
          if [ "$count" -lt 27 ]; then
            echo "FAIL: expected 27+ data-metric attributes, got $count"
            echo "This likely means the deployment failed or app.js threw an error."
            exit 1
          fi

          # Must NOT contain bare keyEnd( -- regression guard
          if echo "$body" | grep -q 'src="js/app\.js"'; then
            js=$(curl -fsSL --max-time 15 "https://hawaiidashboard.org/js/app.js")
            if echo "$js" | grep -qP '(?<!this\.)keyEnd\('; then
              echo "FAIL: live app.js contains bare keyEnd() calls (regression)"
              exit 1
            fi
          fi

          echo "PASS: live site looks healthy"
