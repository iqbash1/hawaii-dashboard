name: Daily question email

# Builds today's Question of the Day email and hands it to Resend as a
# broadcast scheduled for 06:00 HST, so GitHub's cron jitter never moves
# the delivery time. Cron: 15:20 UTC = 05:20 HST (no daylight saving).
#
# Where it goes is the EMAIL_SEND_MODE repository variable:
#   dry-run  a preview to MAIL_TO only (default while trialling)
#   beta     the Beta segment
#   live     the Dashboard readers segment
# The broadcast is named qotd-<date>; a re-run on the same day sends nothing.
# To replace a scheduled send (e.g. after editing today's question), delete
# the scheduled broadcast in Resend, then run this workflow by hand.
#
# Secrets: RESEND_API_KEY, RESEND_SEGMENT_ID, RESEND_BETA_SEGMENT_ID, MAIL_TO

on:
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Send immediately instead of scheduling for 06:00 HST'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: qotd-daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # No npm install: the script uses only Node built-ins and the QOTD bank.
      - name: Build and hand off today's question
        run: node scripts/send-qotd-email.js ${{ inputs.now && '--now' || '' }}
        env:
          EMAIL_SEND_MODE: ${{ vars.EMAIL_SEND_MODE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_BETA_SEGMENT_ID: ${{ secrets.RESEND_BETA_SEGMENT_ID }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # Rolling `email-failed` issue: opened or updated when this job fails,
      # closed again by the next successful run. Rolled up by the weekly
      # health check under "Automated alerts".
      - name: Open or update the email-failed issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create email-failed --description "A subscriber email workflow failed" --color d73a4a 2>/dev/null || true
          N=$(gh issue list --state open --label email-failed --json number --jq '.[0].number // empty')
          BODY="**${{ github.workflow }}** failed on $(date -u +%Y-%m-%dT%H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "Subscriber email failed: ${{ github.workflow }}" --label email-failed --body "$BODY"; fi
      - name: Close the email-failed issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh issue list --state open --label email-failed --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue close "$N" --comment "**${{ github.workflow }}** succeeded on $(date -u +%Y-%m-%dT%H:%MZ). Closing." || true
