name: Data audit
# Twice-daily fresh-fetch of every wired metric vs the canonical federal
# source. Hawaiʻi is the dashboard's centerpiece, so we audit every HI
# year-cell against the source-of-truth and fail if any drifts beyond
# 0.5% relative or 0.0001 absolute.
#
# Output behaviour: maintains a SINGLE rolling issue labeled `data-drift`
# (same pattern as audit-links.yml / cron-heartbeat.yml).
#   - 0 drift  → existing rolling issue (if any) is closed with a comment.
#   - drift    → opens the issue if none exists, or edits the body to the
#                latest drift cells + comments when the cell list changes.
# This replaces the prior behaviour of opening a brand-new issue on every
# run, which produced duplicate issues #33-#39 for a single revision.
#
# Schedule (Hawaiʻi Standard Time, UTC-10):
#   1 PM HST = 23:00 UTC same day
#   6 PM HST = 04:00 UTC next day
#
# Manual trigger via Actions tab → "Data audit" → Run workflow is also wired.

on:
  schedule:
    - cron: '0 23 * * *'  # 1 PM HST
    - cron: '0 4 * * *'   # 6 PM HST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run fresh-fetch audit
        id: audit
        env:
          # api.data.gov umbrella key, covers FBI Crime Data Explorer,
          # NCES Digest, NREL, USDA, and other federal APIs routed through
          # api.usa.gov / api.data.gov gateways. Single key, instant signup.
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          # BLS public API is 25 requests/day no-key. The free key raises
          # to 500/day, enough headroom for two daily audits + monthly
          # build-state-data.js runs. BLS issues keys separately (Labor not
          # on api.data.gov). Set in repo Settings → Secrets when ready.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # FRED (St Louis Fed), wraps BLS State Labor Productivity in a
          # cleaner JSON API. Single key, free, instant signup.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # CDC WONDER (HHS) is also separately registered.
          CDC_WONDER_KEY: ${{ secrets.CDC_WONDER_KEY }}
          # Census API (api.census.gov) began requiring a key ~2026-06-07.
          # Without it the 8 ACS metrics can't be fetched or audited.
          # Register free at https://api.census.gov/data/key_signup.html
          # and add the CENSUS_API_KEY secret.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        # --audit-only mode: exit reflects ONLY Section 16 drift, so
        # unrelated warnings (e.g. county data lag) don't trigger a
        # data-drift issue. We capture the exit code instead of letting it
        # fail the job, then maintain the rolling issue below.
        run: |
          set +e
          set -o pipefail
          npm run audit:drift 2>&1 | tee /tmp/audit-drift.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Extract the drift detail: everything from Section 16 onward,
          # keeping the ERROR lines, the "Drift samples" cells, and RESULT.
          awk '/Section 16:/{flag=1} flag' /tmp/audit-drift.txt \
            | grep -E 'ERROR:|Drift samples:|stored=|RESULT:|drifted' \
            > /tmp/audit-drift-detail.txt || true
          exit 0  # Don't fail the step; the rolling-issue step handles state.

      - name: Maintain rolling data-drift issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const exitCode = parseInt('${{ steps.audit.outputs.exit_code }}', 10);
            const drift = Number.isNaN(exitCode) ? true : exitCode !== 0;

            // Find the existing open rolling issue (if any).
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'data-drift', per_page: 5,
            });
            const existing = open.data[0] || null;

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            // No drift → close any open rolling issue and stop.
            if (!drift) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Fresh-fetch audit clean as of ${today}: 0 drift. Closing.\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            // Drift → create or update the single rolling issue.
            let detail = '';
            try { detail = fs.readFileSync('/tmp/audit-drift-detail.txt', 'utf8').trim(); } catch (e) {}
            if (!detail) detail = '(see workflow logs, Section 16, for the specific drift cells)';

            const body = [
              `The scheduled fresh-fetch audit detected drift between state-data.js and the canonical federal source.`,
              ``,
              `**Last run:** ${runUrl} (${today})`,
              ``,
              'Drift cells (auto-updated; latest run replaces this section):',
              ``,
              '```',
              detail,
              '```',
              ``,
              '---',
              ``,
              '**Investigate:**',
              '1. Confirm the (metric, year) cells above against the canonical source.',
              '2. Re-fetch via `NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/build-state-data.js` (or a scoped per-metric fetch).',
              '3. If it is a legitimate source revision, accept the new vintage, `npm run recompute`, update any narrative rank/value claims, and `npm run validate`.',
              ``,
              'This issue auto-closes when the next scheduled run finds 0 drift.',
            ].join('\n');

            if (existing) {
              // Only comment when the drift cells changed since last update.
              const prevBlock = (existing.body || '').match(/```\n([\s\S]*?)\n```/);
              const prevDetail = prevBlock ? prevBlock[1].trim() : '';
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              if (prevDetail !== detail) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Drift cells changed on ${today}. Run: ${runUrl}`,
                });
              }
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `Data drift detected`,
                body,
                labels: ['data-drift'],
              });
            }

      - name: Ensure data-drift label exists
        if: always()
        run: |
          gh label create data-drift \
            --description "Rolling fresh-fetch drift report; auto-closes when 0 drift remain" \
            --color "d93f0b" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
