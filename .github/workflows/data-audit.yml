name: Data audit
# Twice-daily fresh-fetch of every wired metric vs the canonical federal
# source. Hawaiʻi is the dashboard's centerpiece, so we audit every HI
# year-cell against the source-of-truth and fail if any drifts beyond
# 0.5% relative or 0.0001 absolute.
#
# Schedule (Hawaiʻi Standard Time, UTC-10):
#   1 PM HST = 23:00 UTC same day
#   6 PM HST = 04:00 UTC next day
#
# Manual trigger via Actions tab → "Data audit" → Run workflow is also wired.

on:
  schedule:
    - cron: '0 23 * * *'  # 1 PM HST
    - cron: '0 4 * * *'   # 6 PM HST
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run fresh-fetch audit
        id: audit
        env:
          # api.data.gov umbrella key — covers FBI Crime Data Explorer,
          # NCES Digest, NREL, USDA, and other federal APIs routed through
          # api.usa.gov / api.data.gov gateways. Single key, instant signup.
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          # BLS public API is 25 requests/day no-key. The free key raises
          # to 500/day — enough headroom for two daily audits + monthly
          # build-state-data.js runs. BLS issues keys separately (Labor not
          # on api.data.gov). Set in repo Settings → Secrets when ready.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # FRED (St Louis Fed) — wraps BLS State Labor Productivity in a
          # cleaner JSON API. Single key, free, instant signup.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # CDC WONDER (HHS) is also separately registered.
          CDC_WONDER_KEY: ${{ secrets.CDC_WONDER_KEY }}
        # --audit-only mode: exit reflects ONLY Section 16 drift, so
        # unrelated warnings (e.g. county data lag) don't trigger a
        # data-drift issue creation.
        run: npm run audit:drift

      - name: Open issue on drift
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 16).replace('T', ' ');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data drift detected · ${dateStr} UTC`,
              body: [
                `The scheduled fresh-fetch audit detected drift between state-data.js and the canonical federal source.`,
                ``,
                `**Failed run:** ${runUrl}`,
                ``,
                `**Likely causes (most to least common):**`,
                `- A federal source published a revised vintage (BLS LAUS revisions are typical in February).`,
                `- A hand-paste introduced a value that differs from the fetcher result.`,
                `- A fetcher's parsing logic broke after a source format change.`,
                ``,
                `**Investigate:**`,
                `1. Check the workflow logs for the specific (metric, year) drift cells under Section 16.`,
                `2. Re-fetch via \`NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/build-state-data.js\` locally.`,
                `3. Compare the new state-data.js against this commit.`,
                `4. If the drift is a legitimate source revision, accept the new vintage and update state-data.js + narratives if any historical claims are affected.`,
                ``,
                `Closing this issue without action is fine if the next scheduled run is green.`,
              ].join('\n'),
              labels: ['data-drift']
            });
